  <!-- Google Tag Manager — ADIADO de propósito (PageSpeed mobile): o dataLayer
       existe desde já (lead-form.js enfileira eventos), mas o gtm.js (que puxa
       GA4 + Meta Pixel + CAPI, ~300KB de JS) só carrega na 1ª interação ou
       ~3,5s após o load, tirando esse peso do caminho crítico. No obrigado.html
       o GTM continua imediato (página de conversão). -->
  <script>
    window.dataLayer = window.dataLayer || [];
    (function () {
      var done = false;
      var evs = ['pointerdown', 'touchstart', 'keydown', 'scroll'];
      function loadGTM() {
        if (done) return;
        done = true;
        evs.forEach(function (ev) { window.removeEventListener(ev, loadGTM); });
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var j = document.createElement('script');
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-THZMQD5Z';
        document.head.appendChild(j);
      }
      evs.forEach(function (ev) {
        window.addEventListener(ev, loadGTM, { once: true, passive: true });
      });
      window.addEventListener('load', function () { setTimeout(loadGTM, 3500); });
    })();
  </script>
  <!-- End Google Tag Manager -->
